<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جوافة | حالة صلاحيات الوكلاء</title><style>body{font-family:system-ui,Tahoma,sans-serif;background:#101b17;color:#e6f1e9;margin:0;padding:24px}main{max-width:960px;margin:auto}h1{font-size:1.65rem}section{background:#192b22;border:1px solid #35503e;border-radius:12px;padding:20px;margin:16px 0}p,li{line-height:1.8}.muted{color:#a9b9ae}.bad{color:#ffc184}.good{color:#a2efbd}button{padding:10px 20px;border-radius:8px;border:0;cursor:pointer}code{direction:ltr;unicode-bidi:isolate}a{color:#a2efbd}</style></head><body><main><h1>حالة صلاحيات وكلاء جوافة</h1><p class="muted">لوحة مراجعة غير إنتاجية — لا تمنح صلاحيات ولا تتصل بقاعدة البيانات.</p><button id="refresh" type="button">تحديث السجل</button><p id="loadStatus" role="status">جارٍ التحميل…</p><section><h2>حالة المعالجة</h2><p id="overall">—</p><p id="checked">—</p><p id="environment">—</p></section><section><h2>الأدلة المثبتة</h2><ul id="evidence"></ul></section><section><h2>العمليات غير المكتملة</h2><ul id="pending"></ul></section><section><h2>القيود الملزمة</h2><ul id="restrictions"></ul></section><section><h2>الإجراء التالي</h2><p id="next">—</p></section></main><script>
const dataUrl='./data/agent-permissions-status-2026-11-03.json';
function fill(id,items,render){const root=document.getElementById(id);root.replaceChildren();for(const item of items){const li=document.createElement('li');li.textContent=render(item);root.append(li)}}
async function load(){const status=document.getElementById('loadStatus');status.textContent='جارٍ تحميل السجل…';try{const response=await fetch(dataUrl,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();document.getElementById('overall').textContent='الحالة: '+data.status;document.getElementById('overall').className=data.status==='VERIFIED'?'good':'bad';document.getElementById('checked').textContent='تاريخ التحقق: '+data.checked_at;document.getElementById('environment').textContent='البيئة: '+data.environment;fill('evidence',data.evidence,e=>e.id+' — '+e.status+' — '+e.finding);fill('pending',data.not_completed,x=>x);fill('restrictions',data.restrictions,x=>x);document.getElementById('next').textContent=data.next_action;status.textContent='تم تحميل سجل المراجعة بنجاح. البيانات ليست حالة حية للخادم.'}catch(e){status.textContent='تعذر تحميل السجل: '+e.message;}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
