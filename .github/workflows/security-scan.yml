name: Open-source security scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 15 * * 5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semgrep:
    name: Semgrep source security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned open-source scanner
        run: python -m pip install semgrep==1.182.0
      - name: Scan source without a service account
        run: semgrep scan --config p/ci --metrics=off --error --json-output=semgrep-results.json .
      - name: Save scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: error
          retention-days: 14
