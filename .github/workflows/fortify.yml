name: Fortify AST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 15 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Fortify-AST-Scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      # FoD only: do not mix the SSC/ScanCentral starter configuration here.
      # Set FOD_URL to the region of your actual Fortify on Demand account.
      FOD_URL: ${{ vars.FOD_URL || 'https://ams.fortify.com' }}
      # Configure exactly ONE authentication method in Actions secrets:
      # (1) FOD_CLIENT_ID + FOD_CLIENT_SECRET, or
      # (2) FOD_TENANT + FOD_USER + FOD_PAT.
      FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
      FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
      FOD_TENANT: ${{ secrets.FOD_TENANT }}
      FOD_USER: ${{ secrets.FOD_USER }}
      FOD_PASSWORD: ${{ secrets.FOD_PAT }}

    steps:
      - name: Validate Fortify configuration
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "::error title=Fortify configuration incomplete::$1"
            printf '### Fortify scan: BLOCKED\n\n%s\n\nNo security scan was performed. Configure Actions secrets in Settings > Secrets and variables > Actions, then re-run this workflow. Never put credential values in code or logs.\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if [[ -n "$FOD_CLIENT_ID" || -n "$FOD_CLIENT_SECRET" ]]; then
            [[ -n "$FOD_CLIENT_ID" && -n "$FOD_CLIENT_SECRET" ]] || fail 'Set both FOD_CLIENT_ID and FOD_CLIENT_SECRET.'
            [[ -z "$FOD_USER" && -z "$FOD_PASSWORD" && -z "$FOD_TENANT" ]] || fail 'Configure only one FoD authentication method: client credentials OR tenant/user/PAT.'
          else
            [[ -n "$FOD_USER" && -n "$FOD_PASSWORD" && -n "$FOD_TENANT" ]] || fail 'Set FOD_CLIENT_ID + FOD_CLIENT_SECRET, or FOD_TENANT + FOD_USER + FOD_PAT. These secrets must be available to this run.'
          fi
          echo 'Fortify credential configuration is present; authentication and scan results are still unverified.'

      - name: Check Out Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Fortify Scan
        # Pinned v1.7.0. Do not suppress failures or report missing secrets as success.
        uses: fortify/github-action@ef5539bf4bd9c45c0bd971978f635a69eae55297
        with:
          sast-scan: true
          debricked-sca-scan: true
        env:
          # A successfully submitted scan is not a completed scan.
          DO_WAIT: true
          DO_JOB_SUMMARY: true
