name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Validate Claude authentication without exposing credentials
        shell: bash
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$OAUTH_TOKEN" && -n "$API_KEY" ]]; then
            echo "::error::Configure exactly one Claude authentication mode"
            exit 1
          fi
          if [[ -z "$OAUTH_TOKEN" && -z "$API_KEY" ]]; then
            echo "::error::Claude authentication is not configured"
            exit 1
          fi
          for value in "$OAUTH_TOKEN" "$API_KEY"; do
            if [[ "$value" == * || "$value" == * ]]; then
              echo "::error::Claude credential contains a line break; rotate and replace it"
              exit 1
            fi
          done
          if [[ -n "$OAUTH_TOKEN" ]]; then
            echo "CLAUDE_AUTH_MODE=oauth" >> "$GITHUB_ENV"
          else
            echo "CLAUDE_AUTH_MODE=api" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run Claude with OAuth credential
        if: ${{ env.CLAUDE_AUTH_MODE == 'oauth' }}
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Run Claude with API key
        if: ${{ env.CLAUDE_AUTH_MODE == 'api' }}
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
\n'* || "$value" == *$'\\r'* ]]; then
              echo "::error::Claude credential contains a line break; rotate and replace it"
              exit 1
