name: Claude Code
# Mention @claude in an issue, PR comment or review to run Claude Code on this repo.
# Auth: repo secret CLAUDE_CODE_OAUTH_TOKEN, generated locally with `claude setup-token`.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Validate Claude authentication secret without exposing it
        shell: bash
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$CLAUDE_TOKEN" ]]; then
            echo '::error::CLAUDE_CODE_OAUTH_TOKEN is missing. Configure a valid repository Actions secret.'
            exit 1
          fi
          if [[ "$CLAUDE_TOKEN" == *$'\n'* || "$CLAUDE_TOKEN" == *$'\r'* ]]; then
            echo '::error::CLAUDE_CODE_OAUTH_TOKEN must be a single line. Rotate and re-enter the secret securely.'
            exit 1
          fi
          if [[ ! "$CLAUDE_TOKEN" =~ ^sk-ant-oat[0-9]+-[A-Za-z0-9_-]{60,}$ ]]; then
            echo '::error::CLAUDE_CODE_OAUTH_TOKEN format invalid. Use a newly generated complete token.'
            exit 1
          fi
          echo 'Claude authentication secret format: present, single line (value not displayed).'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
