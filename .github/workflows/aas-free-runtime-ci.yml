name: AAS Free Runtime & Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-bridge-health:
    name: Supabase signed bridge / read-only safety
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout safe read-only verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - name: Synthetic negative/positive and timeout regression
        run: python3 -m unittest -v scripts/tests/test_signed_bridge_health.py
      - name: Inspect public infrastructure health and unsigned-denial only
        env:
          URL: https://zvedrouuboxgbanzdnio.supabase.co/functions/v1/aas-signed-local-worker-bridge
        run: python3 scripts/check_signed_bridge_health.py

  cloudflare-adapter-regression:
    name: Existing Cloudflare candidate regression (not deployed)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Syntax-check local worker and security diagnostics (no secret execution)
        run: |
          node --check aas-cc/runtime/worker/aas-worker-once.js
          node --check aas-cc/runtime/worker/worker-security-test.js
      - name: Run candidate unit tests without secrets
        run: node --test aas-cc/cloudflare-recovery/tests/*.spec.mjs

