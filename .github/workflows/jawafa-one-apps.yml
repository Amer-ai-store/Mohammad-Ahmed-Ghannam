name: JAWAFA ONE AI — tests, APK and Windows EXE
# Builds the installable apps for the multi-company command center (dashboard/one):
#   - Android APK (Trusted Web Activity, apps/android)
#   - Windows installer + portable zip (Electron, apps/desktop)
# and runs the unit, Firestore-rules and end-to-end tests first. Artifacts are debug/unsigned
# builds for testing; they are not a production release (see docs/jawafa-one/RELEASE_READINESS.md).
on:
  push:
    paths:
      - 'dashboard/one/**'
      - 'apps/**'
      - 'firestore.rules'
      - 'tests/**'
      - '.github/workflows/jawafa-one-apps.yml'
  pull_request:
    paths:
      - 'dashboard/one/**'
      - 'apps/**'
      - 'firestore.rules'
      - 'tests/**'
      - '.github/workflows/jawafa-one-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jawafa-one-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Fast syntax validation before emulator installation
        run: |
          node --check tests/e2e/jawafa-one.e2e.mjs
          node --check dashboard/one/app.js
          node --check dashboard/one/trustsoft-evidence.mjs
      - name: Unit tests (core logic, desktop navigation policy)
        run: |
          node --test dashboard/tests/one-core.test.cjs
          node --test apps/desktop/test/*.test.cjs
      - name: Install test tools
        run: |
          mkdir -p "$RUNNER_TEMP/fb" && cd "$RUNNER_TEMP/fb"
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10.14.1 playwright@1.49.1
          npx playwright install --with-deps chromium
          ln -sfn "$RUNNER_TEMP/fb/node_modules" "$GITHUB_WORKSPACE/tests/firestore/node_modules"
      - name: Firestore rules — tenant isolation and RBAC (emulator)
        run: |
          "$RUNNER_TEMP/fb/node_modules/.bin/firebase" emulators:exec --project demo-jawafa-one --only firestore "node --test tests/firestore/tenancy.rules.test.mjs"
      - name: End-to-end (Auth + Firestore emulators, Chromium)
        env:
          FIREBASE_COMPAT_DIR: ${{ runner.temp }}/fb/node_modules/firebase
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/fb/node_modules/playwright/index.js
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: |
          mkdir -p "$EVIDENCE_DIR"
          "$RUNNER_TEMP/fb/node_modules/.bin/firebase" emulators:exec --project demo-jawafa-one --only auth,firestore "node tests/e2e/jawafa-one.e2e.mjs"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jawafa-one-e2e-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14

  android-apk:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon
      - name: Print APK signing certificate (for Digital Asset Links)
        run: |
          APK=$(ls apps/android/app/build/outputs/apk/debug/*.apk)
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" | grep -i sha-256 || true
          sha256sum "$APK"
      # Signed release APK + AAB (Play Store) when the owner has added the signing secrets.
      # Without them only the debug APK is built; its debug key changes per run.
      - name: Build signed release APK and AAB (when signing secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.JAWAFA_ANDROID_KEYSTORE_BASE64 }}
          JAWAFA_KEYSTORE_PASSWORD: ${{ secrets.JAWAFA_ANDROID_KEYSTORE_PASSWORD }}
          JAWAFA_KEY_ALIAS: ${{ secrets.JAWAFA_ANDROID_KEY_ALIAS }}
          JAWAFA_KEY_PASSWORD: ${{ secrets.JAWAFA_ANDROID_KEY_PASSWORD }}
          JAWAFA_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets: skipping release build."; exit 0; fi
          export JAWAFA_KEYSTORE_FILE="$RUNNER_TEMP/jawafa-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$JAWAFA_KEYSTORE_FILE"
          gradle -p apps/android :app:assembleRelease :app:bundleRelease --no-daemon
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs apps/android/app/build/outputs/apk/release/*.apk | grep -i sha-256
          rm -f "$JAWAFA_KEYSTORE_FILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jawafa-one-android-release
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jawafa-one-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build installer and portable zip (unsigned)
        working-directory: apps/desktop
        shell: pwsh
        timeout-minutes: 25
        run: |
          # Electron archive downloads sometimes return transient CDN 504.
          # Retry the lockfile-pinned install only; never bypass integrity checks.
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Output "Installing exact npm lockfile dependencies (attempt $attempt / 3)"
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $installed) { throw 'npm ci failed after three integrity-preserving attempts' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Desktop unit tests failed' }
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer/zip build failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jawafa-one-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14
