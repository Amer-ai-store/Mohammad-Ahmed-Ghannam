name: Project Message Hub CI
on:
  pull_request:
    paths:
      - "dashboard/index.html"
      - "dashboard/project-messages.mjs"
      - "dashboard/project-links.mjs"
      - "dashboard/tests/project-message-hub.test.mjs"
      - ".github/workflows/project-message-hub-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate project message hub scripts
        run: |
          node --check dashboard/project-links.mjs
          node --check dashboard/project-messages.mjs
      - name: Run focused integration and routing tests
        run: node --test dashboard/tests/project-message-hub.test.mjs
