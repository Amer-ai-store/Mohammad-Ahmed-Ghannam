name: Jawafa V1 to V3 stage-2 handoff watch
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/jawafa-v1-stage2-watch.yml'
      - 'tools/jawafa-v1-handoff/**'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: jawafa-v1-stage2-watch
  cancel-in-progress: false
jobs:
  source-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test handoff policy
        run: python3 tools/jawafa-v1-handoff/monitor.py --self-test
      - name: Verify V1 source and linked CI evidence
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/jawafa-v1-handoff/monitor.py
