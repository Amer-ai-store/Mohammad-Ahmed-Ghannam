name: Luqta cross-platform native bundle validation
# Non-production source validation only. This job never reads signing keys, issues a release, or deploys.
on:
  pull_request:
    paths:
      - 'luqta-mobile/**'
      - '.github/workflows/luqta-native-bundle-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: luqta-mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout the exact PR source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Node.js 24 with dependency caching
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: luqta-mobile/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Verify TypeScript and lint
        run: |
          npm run typecheck
          npm run lint
      - name: Bundle actual Android and iOS JavaScript entrypoints
        run: npm run export:mobile
      - name: Verify both platform assets exist
        run: |
          test -d mobile-build
          test -s mobile-build/metadata.json
          node - <<'NODE'
          const fs=require('node:fs');
          const metadata=JSON.parse(fs.readFileSync('mobile-build/metadata.json','utf8'));
          const entries=JSON.stringify(metadata).toLowerCase();
          if (!entries.includes('android') || !entries.includes('ios')) {
            throw new Error('Both Android and iOS bundles must be present in Expo metadata');
          }
          console.log('PASS: Android and iOS JavaScript bundles were exported');
          NODE
      - name: Explain the scope of evidence
        run: echo 'Native JS bundle validation is NOT an APK build, device E2E or Google OAuth acceptance.'
