name: Guava design browser acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/guava-design-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install open-source browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Read-only test of exact Vercel preview
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          BASE="https://souq-almalakiya-jdhz21hxt-a-1857.vercel.app"
          async def main():
           async with async_playwright() as p:
            browser=await p.chromium.launch(headless=True)
            for width,height in [(1366,900),(390,844)]:
             ctx=await browser.new_context(viewport={"width":width,"height":height},device_scale_factor=1)
             page=await ctx.new_page()
             errors=[]
             page.on("pageerror",lambda e:errors.append(str(e)))
             r=await page.goto(BASE+"/",wait_until="domcontentloaded",timeout=60000)
             assert r and r.status==200
             await page.locator("#homeCategories .guava-family-photo").first.wait_for(timeout=45000)
             assert await page.locator("#homeCategories .guava-family-photo").count()==7
             await page.locator("#homeCategories").scroll_into_view_if_needed()
             await page.wait_for_function("Array.from(document.querySelectorAll('#homeCategories .guava-family-photo')).every(i=>i.complete&&i.naturalWidth>0)",timeout=45000)
             await page.screenshot(path=f"guava-home-{width}.png",full_page=False)
             print(f"PASS {width}: seven actual family photos",flush=True)
             await page.locator("#homeCategories [data-jawafa-main='مواد غذائية']").click()
             await page.wait_for_function("!document.querySelector('#page-products').classList.contains('hidden') && document.querySelector('#catalogBreadcrumbs').innerText.includes('مواد غذائية')",timeout=30000)
             await page.locator("#catalogGrid .guava-details").first.wait_for(timeout=45000)
             await page.locator("#catalogGrid .guava-details").first.click()
             assert await page.locator("#guavaDetail").is_visible()
             assert await page.locator("#guavaDetailTitle").inner_text()
             assert "غير متاح" in await page.locator(".guava-detail-note").inner_text()
             await page.screenshot(path=f"guava-detail-{width}.png")
             await page.locator("#guavaDetailClose").click()
             print(f"PASS {width}: category, catalog, and real product detail",flush=True)
             for route in ["jawafa","offers","kitchen","rewards","orders","wallet","support","status","reels"]:
              await page.goto(BASE+"/#"+route,wait_until="domcontentloaded",timeout=45000)
              await page.locator("#page-"+route).wait_for(state="visible",timeout=20000)
             for route in ["/fresh.html","/catalog-full.html","/owner.html"]:
              rr=await page.goto(BASE+route,wait_until="domcontentloaded",timeout=45000)
              assert rr and rr.status==200
              assert await page.locator('link[href*="guava-"]').count()>0
             assert await page.locator("#skipOwnerLogin").count()==1
             cfg=await (await ctx.request.get(BASE+"/api/store-config",timeout=30000)).json()
             assert cfg["store"]["checkoutEnabled"] is False and cfg["store"]["realPaymentsEnabled"] is False
             assert not errors,errors
             print(f"PASS {width}: 9 internal views + 3 separate pages, no page errors, commerce locked",flush=True)
             await ctx.close()
            await browser.close()
           print("GUAVA_V103_ACCEPTANCE_PASS",flush=True)
          asyncio.run(main())
          PY
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guava-v103-design-acceptance
          path: guava-*.png
          if-no-files-found: warn
          retention-days: 7
