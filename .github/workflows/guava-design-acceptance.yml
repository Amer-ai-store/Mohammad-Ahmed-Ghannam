name: Guava design browser acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/guava-design-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install open-source browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Read-only test of merged Vercel preview
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          BASE="https://souq-almalakiya-4r7eezjy5-a-1857.vercel.app"
          async def main():
           async with async_playwright() as p:
            browser=await p.chromium.launch(headless=True)
            for width,height in [(360,800),(390,844),(768,1024),(1024,768),(1440,900),(1920,1080)]:
             ctx=await browser.new_context(viewport={"width":width,"height":height},service_workers="block")
             page=await ctx.new_page()
             errors=[]
             page.on("pageerror",lambda e:errors.append(str(e)))
             response=await page.goto(BASE+"/",wait_until="domcontentloaded",timeout=60000)
             assert response and response.status==200
             await page.locator("#homeCategories .g104-family-img").first.wait_for(timeout=45000)
             assert await page.locator("#homeCategories .g104-family-img").count()==7
             await page.locator("#homeCategories").scroll_into_view_if_needed()
             await page.evaluate("document.querySelectorAll('#homeCategories img').forEach(i=>i.loading='eager')")
             await page.wait_for_function("Array.from(document.querySelectorAll('#homeCategories img')).every(i=>i.complete&&i.naturalWidth>0)",timeout=30000)
             assert await page.evaluate("document.documentElement.scrollWidth<=innerWidth+2")
             await page.screenshot(path=f"guava-home-{width}.png")
             await page.locator("#themeToggle").click()
             assert await page.locator("html").get_attribute("data-theme")=="dark"
             track=page.locator("#homeCategories")
             left=track.locator("..").locator('button[aria-label="انتقل يسارًا"]')
             right=track.locator("..").locator('button[aria-label="انتقل يمينًا"]')
             if await left.is_enabled():
              await left.click()
              await page.wait_for_function("document.querySelector('#homeCategories').scrollLeft<0",timeout=8000)
              await right.click()
             await page.locator("#homeCategories [data-jawafa-main='مواد غذائية']").click()
             await page.locator("#catalogGrid .g104-product-actions").first.wait_for(timeout=45000)
             await page.locator('[data-g104-view="list"]').click()
             assert "g104-list" in await page.locator("#catalogGrid").get_attribute("class")
             await page.locator("#catalogGrid .g104-product-actions button").first.click()
             assert await page.locator("#g104Dialog").is_visible()
             assert "غير متاحين" in await page.locator("#g104Dialog").inner_text()
             await page.locator("#g104DialogClose").click()
             await page.locator("#catalogGrid [data-g104-compare]").first.click()
             await page.locator("[data-g104-count]").click()
             assert "المقارنة حسب الاسم" in await page.locator("#g104Dialog").inner_text()
             await page.locator("#g104DialogClose").click()
             await page.locator("#catalogGrid [data-g104-save]").first.click()
             await page.locator("[data-g104-saved]").click()
             assert "قائمة محفوظة" in await page.locator("#g104Dialog").inner_text()
             await page.locator("#g104DialogClose").click()
             assert await page.locator("#checkoutTrigger").is_disabled()
             await page.screenshot(path=f"guava-catalog-{width}.png")
             print(f"PASS {width}: images, RTL rails, theme, list, detail, compare, local saved list, checkout locked",flush=True)
             if width in [390,1440]:
              for route in ["jawafa","offers","kitchen","rewards","orders","wallet","support","status","reels"]:
               await page.goto(BASE+"/#"+route,wait_until="domcontentloaded")
               await page.locator("#page-"+route).wait_for(state="visible",timeout=20000)
              for route in ["/fresh.html","/catalog-full.html"]:
               rr=await page.goto(BASE+route,wait_until="domcontentloaded")
               assert rr and rr.status==200
               await page.locator("#g104StandaloneTheme").click()
               assert await page.locator("html").get_attribute("data-theme")=="light" or await page.locator("html").get_attribute("data-theme")=="dark"
              rr=await page.goto(BASE+"/owner.html",wait_until="domcontentloaded")
              assert rr and rr.status==200
              assert await page.locator("#skipOwnerLogin").count()==1
              print(f"PASS {width}: internal and standalone screens, owner gate",flush=True)
             cfg=await (await ctx.request.get(BASE+"/api/store-config",timeout=30000)).json()
             assert not cfg["store"]["checkoutEnabled"] and not cfg["store"]["realPaymentsEnabled"]
             assert not errors,errors
             await ctx.close()
            await browser.close()
           print("GUAVA_MERGE_1042_ACCEPTANCE_PASS",flush=True)
          asyncio.run(main())
          PY
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guava-v1042-acceptance
          path: guava-*.png
          if-no-files-found: warn
          retention-days: 7
