name: Guava design browser acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/guava-design-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install open-source browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Read-only test of exact Vercel preview
        run: |
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          BASE="https://souq-almalakiya-7o34obw1a-a-1857.vercel.app"
          async def main():
           async with async_playwright() as p:
            browser=await p.chromium.launch(headless=True)
            for width,height in [(1366,900),(390,844)]:
             ctx=await browser.new_context(viewport={"width":width,"height":height},device_scale_factor=1)
             page=await ctx.new_page()
             errors=[]
             page.on("pageerror",lambda e:errors.append(str(e)))
             response=await page.goto(BASE+"/",wait_until="domcontentloaded",timeout=60000)
             assert response and response.status==200
             await page.locator("#homeCategories [data-jawafa-main]").first.wait_for(timeout=45000)
             assert await page.locator(".guava-quick-categories button").count()==4
             await page.locator(".guava-quick-categories").scroll_into_view_if_needed()
             await page.wait_for_function("Array.from(document.querySelectorAll('.guava-logo,.guava-hero-photo,.guava-quick-categories img')).every(i=>i.complete&&i.naturalWidth>0)",timeout=45000)
             assert await page.locator(".guava-logo").is_visible()
             assert await page.locator(".guava-hero-photo").is_visible()
             assert await page.locator("#guavaHomeSearch").is_visible()
             await page.screenshot(path=f"guava-{width}.png",full_page=False)
             print(f"PASS {width} layout and 6 actual images",flush=True)
             await page.locator(".guava-quick-categories button").filter(has_text="مواد تموينية").click()
             await page.wait_for_function("!document.querySelector('#page-products').classList.contains('hidden')",timeout=20000)
             await page.wait_for_function("document.querySelector('#catalogBreadcrumbs').innerText.includes('تموينية')",timeout=30000)
             print(f"PASS {width} category navigation and selected filter",flush=True)
             await page.goto(BASE+"/#home",wait_until="domcontentloaded")
             await page.locator("#guavaHomeSearch input").fill("حليب")
             await page.locator("#guavaHomeSearch button").click()
             await page.wait_for_function("!document.querySelector('#page-products').classList.contains('hidden') && document.querySelector('#catalogSearch').value==='حليب'",timeout=20000)
             await page.wait_for_timeout(1800)
             assert not errors,errors
             print(f"PASS {width} search navigation; page errors=0",flush=True)
             cfg=await (await ctx.request.get(BASE+"/api/store-config",timeout=30000)).json()
             assert cfg["store"]["checkoutEnabled"] is False and cfg["store"]["realPaymentsEnabled"] is False
             await ctx.close()
            await browser.close()
           print("GUAVA_BROWSER_ACCEPTANCE_PASS",flush=True)
          asyncio.run(main())
          PY
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guava-design-acceptance
          path: guava-*.png
          if-no-files-found: warn
          retention-days: 7
