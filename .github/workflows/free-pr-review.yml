name: Free pull request review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    name: Free PR diff and secret safety review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect PR changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
            git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" > pr.patch
          else
            git diff --check HEAD~1 HEAD
            git diff --name-only HEAD~1 HEAD > changed-files.txt
            git diff --unified=0 HEAD~1 HEAD > pr.patch
          fi
          python3 - <<'PY'
          import re, pathlib, sys
          patch = pathlib.Path('pr.patch').read_text(errors='replace')
          added = '\n'.join(line[1:] for line in patch.splitlines() if line.startswith('+') and not line.startswith('+++'))
          patterns = {
              'GitHub access token': r'gh[pousr]_[A-Za-z0-9_]{30,}',
              'GitHub fine-grained token': r'github_pat_[A-Za-z0-9_]{30,}',
              'Anthropic credential': r'sk-ant-(?:api|oat)[A-Za-z0-9_-]{15,}',
              'Private key header': r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              'AWS access key': r'AKIA[0-9A-Z]{16}',
          }
          hits = [name for name, pattern in patterns.items() if re.search(pattern, added)]
          count = len(pathlib.Path('changed-files.txt').read_text().splitlines())
          summary = f'### Free pull request review\n\nChanged files: **{count}**.\n\nWhitespace: checked by git diff --check.\n\nCredential-pattern check: **{"FAILED" if hits else "PASSED"}**.\n\nThis is static review, not an AI code review.\n'
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out: out.write(summary)
          if hits:
              print('Potential credentials found in added lines: ' + ', '.join(hits), file=sys.stderr)
              sys.exit(1)
          PY
