name: Jawafa verified execution panel checks
on:
  pull_request:
    paths:
      - 'dashboard/index.html'
      - 'dashboard/live-execution.js'
      - 'dashboard/live-execution.css'
      - 'dashboard/tests/live-execution.test.mjs'
      - '.github/workflows/jawafa-live-execution-ci.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/index.html'
      - 'dashboard/live-execution.js'
      - 'dashboard/live-execution.css'
      - 'dashboard/tests/live-execution.test.mjs'
      - '.github/workflows/jawafa-live-execution-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --check dashboard/live-execution.js
      - run: node --test dashboard/tests/live-execution.test.mjs
