name: Luqta 2.0 Android APK
# Builds an installable Android APK of luqta-mobile (Expo SDK 57) and publishes
# test evidence. Runs on the luqta-2.0 feature branch and on demand.
on:
  push:
    branches: [luqta-2.0-design-3d]
    paths:
      - 'luqta-mobile/**'
      - '.github/workflows/luqta-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luqta-apk-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: luqta-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: luqta-mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee ../typecheck.log
      - name: Lint
        if: always()
        run: |
          npm run lint 2>&1 | tee ../lint.log
          if grep -qE 'problems? \([1-9][0-9]* errors?' ../lint.log; then echo '::error::ESLint reported errors'; exit 1; fi
      - name: Unit, integration and feature-ledger tests
        if: always()
        run: npm test 2>&1 | tee ../test.log
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luqta-verification-logs
          path: |
            typecheck.log
            lint.log
            test.log
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: luqta-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: luqta-mobile/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install --clean
      - name: Assemble release APK
        working-directory: luqta-mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.enableMinifyInReleaseBuilds=false
      - name: Checksums and APK facts
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" luqta-2.0.0.apk
          sha256sum luqta-2.0.0.apk | tee luqta-2.0.0.apk.sha256
          ls -l luqta-2.0.0.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging luqta-2.0.0.apk | head -5 | tee apk-badging.txt || true
          "$BT/apksigner" verify --print-certs luqta-2.0.0.apk | tee apk-signature.txt || true
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luqta-2.0.0-apk
          path: |
            luqta-mobile/luqta-2.0.0.apk
            luqta-mobile/luqta-2.0.0.apk.sha256
            luqta-mobile/apk-badging.txt
            luqta-mobile/apk-signature.txt
          if-no-files-found: error
          retention-days: 30

  screens:
    name: Render screens and 3D evidence (web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: luqta-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: luqta-mobile/package-lock.json
      - run: npm ci
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
      - name: Install Playwright Chromium (CI only, not an app dependency)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium
          ln -sfn /tmp/pw/node_modules/playwright node_modules/playwright
      - name: Screenshot every screen
        run: node tools/screens.mjs dist ../evidence/screens
      - name: 3D companion joint evidence
        run: node tools/avatar-evidence.mjs ../evidence/avatar tools/fixtures/face-sample.png
      - name: Walk animation video
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          ffmpeg -y -framerate 24 -i ../evidence/avatar/frames/walk-%03d.png -vf "scale=440:-2" ../evidence/avatar/walk.mp4 >/dev/null 2>&1 || true
          rm -rf ../evidence/avatar/frames
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: luqta-evidence
          path: evidence
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish APK and evidence (branch + pre-release)
    needs: [verify, apk, screens]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
      - name: Commit build outputs to the luqta-apk-builds branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY: ${{ needs.verify.result }}
          SCREENS: ${{ needs.screens.result }}
        run: |
          set -e
          mkdir site && cd site
          cp ../out/luqta-2.0.0-apk/* .
          cp ../out/luqta-verification-logs/* . 2>/dev/null || true
          cp -r ../out/luqta-evidence evidence 2>/dev/null || true
          printf 'commit=%s\nrun=%s\nverify=%s\nscreens=%s\nbuilt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$VERIFY" "$SCREENS" "$(date -u +%FT%TZ)" > BUILD_INFO.txt
          git init -q -b luqta-apk-builds
          git config user.name "luqta-ci"; git config user.email "luqta-ci@users.noreply.github.com"
          git add -A && git commit -qm "Luqta APK build for $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" luqta-apk-builds
      - name: Update the luqta-2.0.0-preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          NOTES="Amer AI Store | لُقطة 2.0.0 — نسخة معاينة موقّعة بمفتاح تطوير. commit ${GITHUB_SHA}. تحقق من البصمة SHA-256 في الملف المرفق."
          if gh release view luqta-2.0.0-preview -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload luqta-2.0.0-preview luqta-2.0.0.apk luqta-2.0.0.apk.sha256 BUILD_INFO.txt -R "$GITHUB_REPOSITORY" --clobber
            gh release edit luqta-2.0.0-preview -R "$GITHUB_REPOSITORY" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create luqta-2.0.0-preview luqta-2.0.0.apk luqta-2.0.0.apk.sha256 BUILD_INFO.txt -R "$GITHUB_REPOSITORY" --prerelease --title "لُقطة 2.0.0 (معاينة)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
