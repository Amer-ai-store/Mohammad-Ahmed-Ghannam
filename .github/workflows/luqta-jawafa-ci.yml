name: Luqta storefront and Jawafa inventory validation
on:
  pull_request:
    paths:
      - 'luqta-mobile/**'
      - 'dashboard/luqta-*.js'
      - 'dashboard/index.html'
      - 'aas-cc/command-center/server/**'
      - 'aas-cc/command-center/scripts/api-live.test.mjs'
      - 'aas-cc/command-center/scripts/live-state.test.mjs'
      - '.github/workflows/luqta-jawafa-ci.yml'
  push:
    branches: [main]
    paths:
      - 'luqta-mobile/**'
      - 'dashboard/luqta-*.js'
      - 'dashboard/index.html'
      - 'aas-cc/command-center/server/**'
      - 'aas-cc/command-center/scripts/api-live.test.mjs'
      - 'aas-cc/command-center/scripts/live-state.test.mjs'
      - '.github/workflows/luqta-jawafa-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: luqta-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: luqta-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --check ../dashboard/luqta-integration.js
      - run: node --check ../dashboard/luqta-api.js

  # Drives the exported web app and the central dashboard in Chromium against the real server, then requires
  # passing evidence for all 125 features on every surface they list (server, app, dashboard).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: luqta-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: luqta-mobile/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:build
      - run: npm run evidence
      - name: Upload screenshots of failing steps and the feature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luqta-e2e-evidence
          path: |
            luqta-mobile/e2e/artifacts/
            luqta-mobile/server/feature-status.json
          if-no-files-found: ignore
          retention-days: 14

  # Tests the real AAS Worker and D1 adapter. This only uses an isolated fixture;
  # no production token, database or deployment is touched.
  command-center-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aas-cc/command-center
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aas-cc/command-center/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Test real D1 Worker contract and schema normalization
        run: node --test scripts/api-live.test.mjs scripts/live-state.test.mjs
