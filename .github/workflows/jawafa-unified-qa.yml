name: Jawafa Unified Main Dashboard & Private Bridge QA
on:
  pull_request:
    paths:
      - "dashboard/index.html"
      - "dashboard/jawafa-integration.js"
      - "dashboard/jawafa-export-monitor.html"
      - "dashboard/tests/jawafa-export-monitor.test.cjs"
      - "dashboard/tests/jawafa-native-integration.test.cjs"
      - "dashboard/tests/jawafa-auth-guard.test.cjs"
      - "dashboard/tests/advisor-fallback.test.cjs"
      - "dashboard/tests/advisor-browser-smoke.cjs"
      - "jawafa-command-bridge/**"
      - "dashboard/trustsoft/**"
      - "dashboard/tests/trustsoft-native-embed.test.cjs"
      - "tools/trustsoft-archive/**"
      - "integrations/trustsoft/**"
      - ".github/workflows/jawafa-unified-qa.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/index.html"
      - "dashboard/jawafa-integration.js"
      - "dashboard/jawafa-export-monitor.html"
      - "dashboard/tests/jawafa-export-monitor.test.cjs"
      - "dashboard/tests/jawafa-native-integration.test.cjs"
      - "dashboard/tests/advisor-fallback.test.cjs"
      - "dashboard/tests/advisor-browser-smoke.cjs"
      - "jawafa-command-bridge/**"
      - "dashboard/trustsoft/**"
      - "dashboard/tests/trustsoft-native-embed.test.cjs"
      - "tools/trustsoft-archive/**"
      - "integrations/trustsoft/**"
      - ".github/workflows/jawafa-unified-qa.yml"
permissions:
  contents: read
jobs:
  isolated-bridge-and-main-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Run durable operational API security and ACK/VERIFY tests
        run: node --test jawafa-command-bridge/test.cjs
      - name: Run native integration and code safety tests
        run: node --test dashboard/tests/jawafa-native-integration.test.cjs dashboard/tests/jawafa-auth-guard.test.cjs dashboard/tests/jawafa-export-monitor.test.cjs dashboard/tests/advisor-fallback.test.cjs dashboard/tests/trustsoft-native-embed.test.cjs tools/trustsoft-archive/build-manifest.test.cjs
      - name: Browser navigation, real DOM, no iframe
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then exit 1; fi
          # Use an isolated Chromium profile, bounded virtual time and a real DOM assertion.
          # A slow runner must not turn a 40s startup delay into a false code regression.
          export DBUS_SESSION_BUS_ADDRESS=
          CHROME_FLAGS=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --no-default-browser-check --disable-background-networking --disable-extensions --virtual-time-budget=8000)
          timeout 90s "$CHROME" "${CHROME_FLAGS[@]}" --user-data-dir="$(mktemp -d)" --dump-dom "file://$GITHUB_WORKSPACE/dashboard/index.html#jawafa-checks" > /tmp/jawafa-native-dom.html
          grep -Fq 'data-view="jawafa-checks"' /tmp/jawafa-native-dom.html
          grep -Fq 'data-view="jawafa-monitor"' /tmp/jawafa-native-dom.html
          grep -Fq 'data-view="jawafa-export"' /tmp/jawafa-native-dom.html
          if grep -Fq 'iframe src="./jawafa-gate15.html"' /tmp/jawafa-native-dom.html; then exit 1; fi
          timeout 90s "$CHROME" "${CHROME_FLAGS[@]}" --user-data-dir="$(mktemp -d)" --window-size=390,844 --force-device-scale-factor=2 --dump-dom "file://$GITHUB_WORKSPACE/dashboard/index.html#jawafa-people" > /tmp/jawafa-mobile-dom.html
          grep -Fq 'data-view="jawafa-people"' /tmp/jawafa-mobile-dom.html
          grep -Fq 'id="chip-nav"' /tmp/jawafa-mobile-dom.html
          grep -Fq 'id="side-nav"' /tmp/jawafa-mobile-dom.html
          echo "Desktop and phone viewport native DOM smoke tests passed"
      - name: Free Chromium advisor interaction test (no paid browser API)
        shell: bash
        run: node dashboard/tests/advisor-browser-smoke.cjs
