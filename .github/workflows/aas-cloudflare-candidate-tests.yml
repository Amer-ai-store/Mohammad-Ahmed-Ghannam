name: AAS Cloudflare candidate regression (mock only)
on:
  pull_request:
    paths:
      - 'aas-cc/cloudflare-recovery/**'
      - '.github/workflows/aas-cloudflare-candidate-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Run offline mocked POS CHANGE BLOCK and security tests
        run: node --test aas-cc/cloudflare-recovery/tests/adapter.spec.mjs
      - name: Explain evidence boundary
        run: echo "Mock tests only; independent QA and live Cloudflare inference are NOT verified."
