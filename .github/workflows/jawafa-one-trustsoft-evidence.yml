name: JAWAFA ONE TrustSoft evidence safe integration
on:
  pull_request:
    paths:
      - "dashboard/one/trustsoft-public-summary.json"
      - "dashboard/one/trustsoft-evidence.mjs"
      - "dashboard/one/app.js"
      - "dashboard/one/index.html"
      - "dashboard/one/styles.css"
      - "dashboard/one/sw.js"
      - "dashboard/tests/trustsoft-evidence.test.mjs"
      - ".github/workflows/jawafa-one-trustsoft-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: TrustSoft analysis, privacy and local-only import validation
        run: node --test dashboard/tests/trustsoft-evidence.test.mjs
      - name: JavaScript syntax
        run: |
          node --check dashboard/one/app.js
          node --check dashboard/one/trustsoft-evidence.mjs
      - name: Regression checks for JAWAFA ONE pure logic
        run: node --test dashboard/tests/one-core.test.cjs
