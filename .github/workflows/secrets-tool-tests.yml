name: Secrets tool tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/secrets/**'
      - '.github/workflows/secrets-tool-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test with mocked GitHub operations (no secrets required)
        run: python3 -m unittest discover -s tools/secrets -p 'test_*.py'
