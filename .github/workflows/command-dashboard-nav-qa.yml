name: Command center grouped navigation checks
on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/command-dashboard-nav-qa.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/command-dashboard-nav-qa.yml'
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --test dashboard/tests/navigation.test.mjs dashboard/tests/jawafa-investigation.test.mjs
