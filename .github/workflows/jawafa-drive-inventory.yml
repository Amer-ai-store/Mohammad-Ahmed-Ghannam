name: Jawafa Drive inventory verification
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth
      - name: Verify export privately
        env:
          DRIVE_CREDENTIALS: ${{ secrets.JAWAFA_GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DRIVE_CREDENTIALS" ]; then
            echo "::error::Missing JAWAFA_GOOGLE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/drive-creds.json"
          printf '%s' "$DRIVE_CREDENTIALS" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset DRIVE_CREDENTIALS
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          python tools/jawafa_drive_readonly_verify.py > "$RUNNER_TEMP/private-verification.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/private-verification.json")); print("Tables:",d["inventory_count"],"Files:",d["drive_csv_count"],"Verified:",d["verified"])'
