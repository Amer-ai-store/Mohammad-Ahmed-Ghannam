name: Claude code review
# Reviews every pull request with Claude: inline comments on specific lines plus one summary comment.
# Needs one repository secret, CLAUDE_CODE_OAUTH_TOKEN (Claude subscription) or ANTHROPIC_API_KEY (API key).
# No valid credential => review fails closed. A green review must mean Claude ran successfully.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CONFIGURED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      # A missing or malformed credential must never produce a green 'review' check.
      - name: Require Claude authentication
        if: env.CLAUDE_CONFIGURED != 'true'
        run: |
          echo "::error title=Claude review blocked::No authentication secret is configured. Set exactly one of CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY in this repository's Actions secrets. See docs/code-review-setup.md."
          exit 1
      - name: Prepare the Claude token
        if: env.CLAUDE_CONFIGURED == 'true'
        shell: python
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          import os
          import re

          raw = os.environ.get("RAW_TOKEN", "")
          has_api_key = os.environ.get("HAS_API_KEY") == "true"

          # Prefer the API key when both credentials exist; never pass both to the action.
          # Do not attempt to reconstruct an OAuth token from arbitrary copied terminal text.
          # Only an exact one-line value is allowed, avoiding truncated/wrapped/forged tokens.
          if has_api_key:
              print("::notice title=Claude API authentication::ANTHROPIC_API_KEY is selected; any OAuth secret is ignored.")
          elif re.fullmatch(r"sk-ant-oat[0-9]+-[A-Za-z0-9_-]{60,}", raw):
              print(f"::add-mask::{raw}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"CLAUDE_TOKEN={raw}\n")
          else:
              print(
                  "::error title=Claude OAuth credential invalid::CLAUDE_CODE_OAUTH_TOKEN must be "
                  "the entire single-line token created by 'claude setup-token' (no labels, "
                  "line wraps, quotes or truncated fragments). Replace the repository Actions "
                  "secret using the verified setup guide in docs/code-review-setup.md."
              )
              raise SystemExit(1)
      - if: env.CLAUDE_CONFIGURED == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Review the pull request
        if: env.CLAUDE_CONFIGURED == 'true'
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The built-in token instead of the Claude app's: the app refuses runs on PRs that add or change
          # workflow files, and this keeps reviews working on those PRs too. Comments come from github-actions.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The project is an Android app (Kotlin, Jetpack Compose, Room, Firebase)
            with a web dashboard in dashboard/ and GitHub Actions workflows in .github/workflows/.

            Look for, in this order:
            1. Bugs: wrong results, crashes, broken flows, data loss, race conditions.
            2. Security: authentication and roles, secrets or personal data in code, logs or APKs, unsafe input.
            3. Missing or weak tests for the changed behaviour.
            Skip style preferences that do not affect behaviour.

            Use mcp__github_inline_comment__create_inline_comment for each issue on a specific line.
            Then post one summary with `gh pr comment`: what the PR does, the issues found ordered by severity,
            and a clear verdict. Write all comments in Arabic; keep code, file names and identifiers as they are.
            Only post GitHub comments; do not reply with review text as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  auth-guard-tests:
    name: Claude auth guard static regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bash syntax
        run: bash -n scripts/save-claude-token.sh
      - name: Exercise synthetic auth inputs without real secrets
        run: python3 scripts/tests/test_claude_auth_guard.py
