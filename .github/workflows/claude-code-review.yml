name: Claude code review
# Reviews every pull request with Claude: inline comments on specific lines plus one summary comment.
# Needs one repository secret, CLAUDE_CODE_OAUTH_TOKEN (Claude subscription) or ANTHROPIC_API_KEY (API key).
# Until one exists the job passes with a notice instead of failing every PR. See docs/code-review-setup.md.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CONFIGURED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when Claude is not set up
        if: env.CLAUDE_CONFIGURED != 'true'
        run: echo "::notice title=Claude review skipped::Add the repository secret CLAUDE_CODE_OAUTH_TOKEN (run 'claude setup-token') or ANTHROPIC_API_KEY. See docs/code-review-setup.md."
      # A pasted secret often carries the rest of the `claude setup-token` output, or the token wrapped over several
      # lines, and the API then rejects it. Take the sk-ant-oat token out of it; never print the value.
      - name: Prepare the Claude token
        if: env.CLAUDE_CONFIGURED == 'true'
        shell: python
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          import os, re

          TOKEN_START = re.compile(r"sk-ant-oat\d+-[A-Za-z0-9_-]+")
          # Box-drawing borders and quotes that terminals and copy tools put around the token.
          BORDER = " \t'\"`│┃║|╭╮╰╯─━═"

          raw = os.environ.get("RAW_TOKEN", "")
          if raw:
              lines = raw.replace("\r", "").split("\n")
              token, before, after = None, "", ""
              for i, line in enumerate(lines):
                  match = TOKEN_START.search(line)
                  if not match:
                      continue
                  before, after = line[: match.start()], line[match.end():]
                  # A terminal may wrap the long token over several lines; join the pieces that follow it.
                  parts = [match.group(0)]
                  if not after.strip(BORDER):
                      for nxt in lines[i + 1:]:
                          piece = nxt.strip(BORDER)
                          if not re.fullmatch(r"[A-Za-z0-9_-]+", piece):
                              break
                          parts.append(piece)
                  token = "".join(parts)
                  break
              if not token or not re.fullmatch(r"sk-ant-oat\d+-[A-Za-z0-9_-]{20,}", token):
                  found = "contains" if "sk-ant-oat" in raw else "does not contain"
                  # Describe only the shape around the token: letters and digits are hidden, since they may be part of it.
                  hide = lambda text: re.sub(r"[A-Za-z0-9_-]", "*", text)
                  context = f" Around it: {hide(before[-12:])!r} ... {hide(after[:12])!r}." if token else ""
                  print(
                      "::error title=CLAUDE_CODE_OAUTH_TOKEN is malformed::No usable token in the secret: it is "
                      f"{len(raw)} characters on {len(lines)} lines and {found} 'sk-ant-oat'.{context} Paste only the "
                      "token printed by 'claude setup-token' under Settings > Secrets and variables > Actions."
                  )
                  raise SystemExit(1)
              print(f"::add-mask::{token}")
              if token != raw:
                  print(
                      "::warning title=CLAUDE_CODE_OAUTH_TOKEN has extra text::Used the sk-ant-oat token found inside "
                      "the secret. Replace the secret with the token alone to remove this warning."
                  )
              with open(os.environ["GITHUB_ENV"], "a") as env_file:
                  env_file.write(f"CLAUDE_TOKEN={token}\n")
      - if: env.CLAUDE_CONFIGURED == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Review the pull request
        if: env.CLAUDE_CONFIGURED == 'true'
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The built-in token instead of the Claude app's: the app refuses runs on PRs that add or change
          # workflow files, and this keeps reviews working on those PRs too. Comments come from github-actions.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The project is an Android app (Kotlin, Jetpack Compose, Room, Firebase)
            with a web dashboard in dashboard/ and GitHub Actions workflows in .github/workflows/.

            Look for, in this order:
            1. Bugs: wrong results, crashes, broken flows, data loss, race conditions.
            2. Security: authentication and roles, secrets or personal data in code, logs or APKs, unsafe input.
            3. Missing or weak tests for the changed behaviour.
            Skip style preferences that do not affect behaviour.

            Use mcp__github_inline_comment__create_inline_comment for each issue on a specific line.
            Then post one summary with `gh pr comment`: what the PR does, the issues found ordered by severity,
            and a clear verdict. Write all comments in Arabic; keep code, file names and identifiers as they are.
            Only post GitHub comments; do not reply with review text as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
