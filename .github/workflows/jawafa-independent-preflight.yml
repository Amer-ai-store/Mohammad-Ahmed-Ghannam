name: Jawafa independent release preflight (source-only)
on:
  pull_request:
    paths:
      - 'tools/release/independent-preflight.mjs'
      - 'tools/release/independent-preflight.test.mjs'
      - '.github/workflows/jawafa-independent-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-signature-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '24'
      - name: Fail-closed detached signature tests (synthetic only)
        run: node --test tools/release/independent-preflight.test.mjs
      - name: State acceptance boundary
        run: |
          echo 'Source gate tests only. This run contains no production credentials or live E2E proof.'
          echo 'Issue #102 remains blocking. Do not deploy on this workflow.'
