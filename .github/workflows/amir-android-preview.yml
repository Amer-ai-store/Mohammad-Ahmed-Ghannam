name: Amir Android preview APK
on:
  pull_request:
    paths:
      - 'apps/amir-mobile/android/**'
      - '.github/workflows/amir-android-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Ensure Android SDK platform
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -f "$sdk/platforms/android-35/android.jar" || ! -x "$sdk/build-tools/35.0.0/apksigner" ]]; then
            sdk="$RUNNER_TEMP/amir-android-sdk"
            mkdir -p "$sdk/cmdline-tools"
            curl --fail --location --retry 2 --max-time 150 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-tools.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            set +o pipefail
            yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
            set -o pipefail
            "$manager" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/apksigner"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo AMIR_ANDROID_SDK_READY
      - name: Build and verify preview APK
        run: bash apps/amir-mobile/android/build-preview.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Amir-AI-Store-Android-preview
          path: apps/amir-mobile/android/dist/
          if-no-files-found: error
          retention-days: 14
