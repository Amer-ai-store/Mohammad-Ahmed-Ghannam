name: Release Android app
# Every push to main that changes the app runs the unit tests, builds a signed release APK and publishes it
# as a GitHub Release. The newest APK is always at:
# https://github.com/Mohammadzxzx1991/Mohammad-Ahmed-Ghannam/releases/latest/download/amer-store.apk
# Pull request and manual runs outside main build and upload the APK but publish nothing. See docs/release-setup.md.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.env.example'
      - '.github/workflows/release.yml'
  # A PR that changes this pipeline or the signing config builds the release APK too, without publishing it.
  pull_request:
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Read by app/build.gradle.kts; a rising versionCode lets each APK install over the previous one.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.3.1'
      # Same as android-build.yml: Firebase keys are not secret; ADMIN_PASSWORD never goes into a public APK.
      - name: Write Firebase keys from repository secrets (optional)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          cp .env.example .env
          for k in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_PROJECT_ID; do
            v="${!k}"
            if [ -n "$v" ]; then
              grep -v "^$k=" .env > .env.tmp && mv .env.tmp .env
              printf '%s=%s\n' "$k" "$v" >> .env
            fi
          done
      # The release signingConfig in app/build.gradle.kts reads KEYSTORE_PATH, STORE_PASSWORD and KEY_PASSWORD (alias "upload").
      - name: Prepare the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload-key.jks"
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$keystore"
            store_password="$SIGNING_STORE_PASSWORD"
            key_password="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set, so this APK is signed with a one-off key. Phones must uninstall the previous version before installing it. See docs/release-setup.md."
            store_password="$(openssl rand -hex 16)"
            key_password="$store_password"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$store_password" -keypass "$key_password" -dname "CN=Amer Store CI" -noprompt
          fi
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "KEYSTORE_PATH=$keystore"
            echo "STORE_PASSWORD=$store_password"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
      - name: Run unit tests and build the release APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/amer-store.apk"
      - name: Publish the GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "v$VERSION_NAME" "$RUNNER_TEMP/amer-store.apk" \
            --repo "$REPO" --target "$SHA" \
            --title "Amer Store $VERSION_NAME" --generate-notes --latest
      - name: Upload the APK (pull request and manual runs)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amer-store-release-apk
          path: ${{ runner.temp }}/amer-store.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
