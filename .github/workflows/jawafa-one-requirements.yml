name: JAWAFA ONE requirements evidence consistency
on:
  pull_request:
    paths:
      - 'docs/jawafa-one/IMPLEMENTATION_STATUS.md'
      - 'docs/jawafa-one/REQUIREMENTS_MATRIX.md'
      - 'tools/check-jawafa-one-requirements.cjs'
      - '.github/workflows/jawafa-one-requirements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate 69 rows and status counts
        run: node tools/check-jawafa-one-requirements.cjs
      - name: Validate current roster navigation assertions
        run: node --test dashboard/tests/aas-roster.test.cjs
