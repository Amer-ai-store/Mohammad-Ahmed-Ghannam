<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123c31">
  <meta name="description" content="Amer AI Store — مركز قيادة موحّد ومساحات عمل الوكلاء لإدارة المهام والموافقات.">
  <title>Amer AI Store · مركز القيادة</title>
  <script>
    (() => {
      let preference = 'system';
      try {
        const saved = localStorage.getItem('aas-theme');
        if (['system', 'light', 'dark'].includes(saved)) preference = saved;
      } catch {}
      const dark = preference === 'dark' || (preference === 'system' && typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#0d1614' : '#f7f8f5';
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="sr-only skip-link" href="#content">انتقل إلى المحتوى</a>
  <div id="app"></div>
  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
