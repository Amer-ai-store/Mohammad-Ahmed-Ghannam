# docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# Put a TLS reverse proxy (Caddy/Nginx/Cloudflare) in front: the app requires HTTPS.
services:
  luqta:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["luqta-data:/data"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${PUBLIC_HOST:-shop.example.com} --to luqta:8787
    depends_on: [luqta]
    volumes: ["caddy-data:/data"]
volumes:
  luqta-data: {}
  caddy-data: {}
