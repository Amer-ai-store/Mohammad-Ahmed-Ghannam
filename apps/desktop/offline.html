<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>JAWAFA ONE AI — غير متصل</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05080a;color:#eef6f1;font-family:"Segoe UI",Tahoma,sans-serif}
.card{max-width:460px;border:1px solid #1d3a30;border-radius:16px;padding:28px;background:#0d1714;text-align:center}
h1{color:#d9b45a;font-size:1.4rem}p{color:#93a89e;line-height:1.7}button{background:#22c55e;border:0;border-radius:10px;padding:10px 22px;font-weight:700;cursor:pointer}</style></head>
<body><div class="card"><h1>تعذّر الاتصال بمركز القيادة</h1>
<p>يحتاج JAWAFA ONE AI إلى الإنترنت لتسجيل الدخول وقراءة بيانات شركتك. لا يعرض التطبيق بيانات مخزنة أو تقديرية عند انقطاع الاتصال.</p>
<p id="r" style="font-size:.8rem"></p><button id="retry" type="button">إعادة المحاولة</button></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById("r").textContent=q.get("reason")||"";
// Only an https address (or http on localhost for development) may be retried; anything else,
// such as javascript: or file:, is ignored.
function safeRetryUrl(raw){try{const u=new URL(raw);const local=u.hostname==="localhost"||u.hostname==="127.0.0.1";return u.protocol==="https:"||(u.protocol==="http:"&&local)?u.href:null}catch{return null}}
const target=safeRetryUrl(q.get("url"));
const btn=document.getElementById("retry");
if(!target)btn.disabled=true;else btn.addEventListener("click",()=>{location.href=target});
</script></body></html>
